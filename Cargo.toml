[package]
name = "tuido"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven terminal todo app with natural-language due dates and desktop notifications"
authors = ["Nicolas Bettenburg <nicbet@gmail.com>"]
license = "MIT"
repository = "https://github.com/nicbet/tuido"
homepage = "https://github.com/nicbet/tuido"
readme = "README.md"
keywords = ["todo", "tui", "terminal", "ratatui", "cli"]
categories = ["command-line-utilities"]
exclude = ["/demo", "/.xpo", "/.claude", "/.codex", "/.github", "/.mcp.json", "/AGENTS.md", "/CLAUDE.md"]

[dependencies]
ratatui = "0.30"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.18"
dirs = "7.0"
regex = "1.13"

[dev-dependencies]
tempfile = "3"
